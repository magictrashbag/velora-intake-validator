<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kame Review Console</title>
<link rel="stylesheet" href="/staff/console.css">
</head>
<body>
<header>
  <strong class="brand">
    <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="13" fill="#FFC21A"/>
      <g fill="#111"><circle cx="24" cy="8.6" r="4.2"/>
        <ellipse cx="13.2" cy="15.5" rx="4.6" ry="2.7" transform="rotate(-35 13.2 15.5)"/><ellipse cx="34.8" cy="15.5" rx="4.6" ry="2.7" transform="rotate(35 34.8 15.5)"/>
        <ellipse cx="13.2" cy="34.5" rx="4.6" ry="2.7" transform="rotate(35 13.2 34.5)"/><ellipse cx="34.8" cy="34.5" rx="4.6" ry="2.7" transform="rotate(-35 34.8 34.5)"/>
        <path d="M21.6 38.2 24 43.4l2.4-5.2z"/><ellipse cx="24" cy="25" rx="12.2" ry="13.8"/></g>
      <path d="M24 19.6l4.7 2.7v5.4L24 30.4l-4.7-2.7v-5.4zM24 19.6v-7.6M28.7 22.3L33.7 19.4M28.7 27.7L33.7 30.6M24 30.4v7.6M19.3 27.7L14.3 30.6M19.3 22.3L14.3 19.4" stroke="#FFC21A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Kame · Review console
  </strong>
  <form id="login">
    <input id="token" type="password" placeholder="Staff token" autocomplete="off" required>
    <button>Sign in</button>
  </form>
  <button id="logout" hidden>Sign out</button>
</header>
<main>
  <section id="list">
    <div class="bar">
      <select id="status">
        <option value="">Open + awaiting 2nd approval</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="blocked">Blocked</option>
      </select>
      <button id="refresh">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Opened</th><th>Type</th><th>Status</th><th>Reasons</th><th>Customer</th></tr></thead>
      <tbody id="cases"></tbody>
    </table>
    <p id="empty" class="muted" hidden>No cases.</p>
  </section>
  <section id="detail" hidden>
    <h2 id="d-title"></h2>
    <div id="d-body"></div>
    <h3>Decide</h3>
    <textarea id="note" rows="3" placeholder="Required: what you checked and why (5+ characters)"></textarea>
    <div class="bar">
      <button data-action="approve" class="primary">Approve</button>
      <button data-action="reject">Reject (refund)</button>
      <button data-action="block" class="danger">Block (OFAC)</button>
      <button data-action="comment">Comment</button>
    </div>
    <p id="result" role="status"></p>
  </section>
</main>
<script src="/staff/console.js"></script>
</body>
</html>
