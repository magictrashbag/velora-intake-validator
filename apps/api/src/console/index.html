<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente Review Console</title>
<link rel="stylesheet" href="/staff/console.css">
</head>
<body>
<header>
  <strong>Puente · Review console</strong>
  <form id="login">
    <input id="token" type="password" placeholder="Staff token" autocomplete="off" required>
    <button>Sign in</button>
  </form>
  <button id="logout" hidden>Sign out</button>
</header>
<main>
  <section id="list">
    <div class="bar">
      <select id="status">
        <option value="">Open + awaiting 2nd approval</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="blocked">Blocked</option>
      </select>
      <button id="refresh">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Opened</th><th>Type</th><th>Status</th><th>Reasons</th><th>Customer</th></tr></thead>
      <tbody id="cases"></tbody>
    </table>
    <p id="empty" class="muted" hidden>No cases.</p>
  </section>
  <section id="detail" hidden>
    <h2 id="d-title"></h2>
    <div id="d-body"></div>
    <h3>Decide</h3>
    <textarea id="note" rows="3" placeholder="Required: what you checked and why (5+ characters)"></textarea>
    <div class="bar">
      <button data-action="approve" class="primary">Approve</button>
      <button data-action="reject">Reject (refund)</button>
      <button data-action="block" class="danger">Block (OFAC)</button>
      <button data-action="comment">Comment</button>
    </div>
    <p id="result" role="status"></p>
  </section>
</main>
<script src="/staff/console.js"></script>
</body>
</html>
